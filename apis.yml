name: Seek AI
description: >-
  Seek AI was a New York City generative-AI enterprise data analytics company,
  backed by Battery Ventures, that built a conversational analytics agent letting
  business users query enterprise data in natural language and receive
  trustworthy answers (translating plain-language questions into SQL and
  narrative results over a company's own databases and warehouses). In 2025 Seek
  AI was acquired by IBM and folded into IBM watsonx AI Labs, a developer-first
  agentic-AI innovation hub in New York City; the company no longer operates an
  independent product, developer program, or public API. Its former developer
  subdomain (developers.seek.ai) now redirects to IBM's watsonx AI Labs, and the
  standalone seek.ai marketing site is no longer served. This API Evangelist
  profile records Seek AI as an acquired portfolio company and carries no live
  API surface to enrich.
